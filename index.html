<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کتاب گرد</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALa0FRdcMhIh2_RehjpFW80ebVIfzdDss",
            authDomain: "ketabgard-48d6e.firebaseapp.com",
            projectId: "ketabgard-48d6e",
            storageBucket: "ketabgard-48d6e.firebasestorage.app",
            messagingSenderId: "122721307630",
            appId: "1:122721307630:web:0b62bd4f43afa273785cff"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.firebase = { auth, db, storage };
    </script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>کتاب گرد</h1>
            <nav>
                <button class="nav-button active" data-target="feed-screen"><span class="material-icons">home</span></button>
                <button class="nav-button" data-target="profile-screen"><span class="material-icons">person</span></button>
                <button class="nav-button" data-target="login-screen" id="login-nav-button"><span class="material-icons">login</span></button>
            </nav>
        </header>

        <main>
            <section id="feed-screen" class="screen active">
                <div class="posts-list">
                    <!-- Posts will be loaded here dynamically -->
                </div>
                <button id="add-post-button" class="fab"><span class="material-icons">add</span></button>
            </section>

            <section id="profile-screen" class="screen">
                <div class="profile-header">
                    <div class="profile-picture" id="profile-picture">
                        <div class="avatar-placeholder large">ک</div>
                    </div>
                    <h2 id="profile-username">کاربر کتاب‌گرد</h2>
                    <p id="profile-bio">علاقه‌مند به ادبیات کلاسیک و فلسفه</p>
                    <button class="edit-bio-button"><span class="material-icons">edit</span> ویرایش بیو</button>
                    <p>نقش: <span id="profile-role">کاربر</span></p>
                    <input type="file" id="profile-image-upload" accept="image/*" style="display:none">
                    <button class="submit-button" id="change-profile-image-button">تغییر عکس پروفایل</button>
                    <button class="submit-button" id="logout-button">خروج از حساب</button>
                </div>
                <h3>پست‌های من</h3>
                <div class="user-posts-list posts-list">
                    <!-- User posts will be loaded here dynamically -->
                </div>
            </section>

            <section id="add-post-screen" class="screen">
                <h2>افزودن پست جدید</h2>
                <form id="new-post-form">
                    <div class="form-group">
                        <label for="book-title">عنوان کتاب:</label>
                        <input type="text" id="book-title" required>
                    </div>
                    <div class="form-group">
                        <label for="book-author">نام نویسنده:</label>
                        <input type="text" id="book-author" required>
                    </div>
                    <div class="form-group">
                        <label for="book-quote">جمله یا نقل‌قول کوتاه:</label>
                        <textarea id="book-quote" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="book-cover-upload">عکس جلد (اختیاری):</label>
                        <input type="file" id="book-cover-upload" accept="image/*">
                        <img id="book-cover-preview" src="#" alt="Book Cover Preview" style="display: none; max-width: 100px; margin-top: 10px;">
                    </div>
                    <button type="submit" class="submit-button">ارسال پست</button>
                    <button type="button" class="cancel-button" id="cancel-post-button">انصراف</button>
                </form>
            </section>

            <section id="login-screen" class="screen">
                <h2>ورود / ثبت نام</h2>
                <form id="auth-form">
                    <div class="form-group">
                        <label for="username">نام کاربری:</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">رمز عبور:</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit" class="submit-button">ورود</button>
                    <button type="button" class="cancel-button" id="register-button">ثبت نام</button>
                </form>
            </section>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
