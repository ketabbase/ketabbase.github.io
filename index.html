<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وایب‌بورد</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1><img src="https://uploadkon.ir/uploads/54a413_25kb.png" alt="لوگو وایب‌بورد" style="width: 30px; height: 30px; margin-left: 10px; vertical-align: middle;"> وایب‌بورد</h1>
            <nav>
                <button class="nav-button active" data-target="feed-screen"><span class="material-icons">home</span></button>
                <button class="nav-button" data-target="profile-screen"><span class="material-icons">person</span></button>
                <button class="nav-button" data-target="login-screen" id="login-nav-button"><span class="material-icons">login</span></button>
            </nav>
        </header>

        <main>
            <section id="loading-screen" class="screen active">
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <p>در حال بارگذاری...</p>
                </div>
            </section>
 
            <section id="feed-screen" class="screen">
                <div class="posts-list">
                    <!-- Posts will be loaded here dynamically -->
                </div>
                <button id="add-post-button" class="fab"><span class="material-icons">add</span></button>
            </section>

            <section id="profile-screen" class="screen">
                <div class="profile-header">
                    <div class="profile-picture">
                        <div class="avatar-placeholder" id="profile-avatar">U</div>
                        <input type="file" id="profile-photo-upload" accept="image/*" style="display: none;">
                        <button class="change-photo-button" id="change-photo-button">
                            <span class="material-icons">photo_camera</span>
                        </button>
                    </div>
                    <h2 id="profile-username">کاربر وایب‌بورد</h2>
                    <p id="profile-bio">علاقه‌مند به ادبیات کلاسیک و فلسفه</p>
                    <button class="edit-bio-button" id="edit-bio-button"><span class="material-icons">edit</span> ویرایش بیو</button>
                    <p>نقش: <span id="profile-role">کاربر</span></p>
                    <button class="submit-button" id="logout-button">خروج از حساب</button>
                </div>
                
                <!-- Personal Library Section -->
                <div class="library-section">
                    <div class="library-header">
                        <h3>کتابخانه شخصی</h3>
                        <button class="add-library-item-button" id="add-library-item-button">
                            <span class="material-icons">library_add</span> افزودن به کتابخانه
                        </button>
                    </div>
                    
                    <div class="library-filter-tabs">
                        <button class="filter-tab active" data-status="all">همه</button>
                        <button class="filter-tab" data-status="completed">خوانده/دیده شده</button>
                        <button class="filter-tab" data-status="reading">در حال خواندن/تماشا</button>
                        <button class="filter-tab" data-status="want">می‌خواهم ببینم</button>
                    </div>
                    
                    <div class="library-items-list" id="library-items-list">
                        <!-- Library items will be loaded here -->
                    </div>
                </div>

                <h3>پست‌های من</h3>
                <div class="user-posts-list posts-list">
                    <!-- User posts will be loaded here dynamically -->
                </div>
            </section>

            <section id="add-post-screen" class="screen">
                <h2>افزودن پست جدید</h2>
                <form id="new-post-form">
                    <div class="form-group">
                        <label for="book-title">عنوان کتاب/فیلم:</label>
                        <input type="text" id="book-title" required>
                    </div>
                    <div class="form-group">
                        <label for="book-author">نام نویسنده/کارگردان:</label>
                        <input type="text" id="book-author" required>
                    </div>
                    <div class="form-group">
                        <label for="book-quote">جمله یا نقل‌قول کوتاه:</label>
                        <textarea id="book-quote" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="book-cover-upload">عکس (اختیاری):</label>
                        <input type="file" id="book-cover-upload" accept="image/*">
                        <img id="book-cover-preview" src="#" alt="Book Cover Preview" style="display: none; max-width: 100px; margin-top: 10px;">
                    </div>
                    <button type="submit" class="submit-button">ارسال پست</button>
                    <button type="button" class="cancel-button" id="cancel-post-button">انصراف</button>
                </form>
            </section>

            <section id="add-library-item-screen" class="screen">
                <h2>افزودن به کتابخانه شخصی</h2>
                <form id="new-library-item-form">
                    <div class="form-group">
                        <label for="library-item-type">نوع:</label>
                        <select id="library-item-type" required>
                            <option value="book">کتاب</option>
                            <option value="movie">فیلم</option>
                            <option value="series">سریال</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="library-item-title">عنوان:</label>
                        <input type="text" id="library-item-title" required>
                    </div>
                    <div class="form-group">
                        <label for="library-item-author">نام نویسنده/کارگردان:</label>
                        <input type="text" id="library-item-author" required>
                    </div>
                    <div class="form-group">
                        <label for="library-item-status">وضعیت:</label>
                        <select id="library-item-status" required>
                            <option value="want">می‌خواهم بخوانم/ببینم</option>
                            <option value="reading">در حال خواندن/تماشا</option>
                            <option value="completed">خوانده/دیده شده</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="library-item-rating">امتیاز (اختیاری):</label>
                        <select id="library-item-rating">
                            <option value="">انتخاب کنید</option>
                            <option value="5">⭐⭐⭐⭐⭐ عالی</option>
                            <option value="4">⭐⭐⭐⭐ خوب</option>
                            <option value="3">⭐⭐⭐ متوسط</option>
                            <option value="2">⭐⭐ ضعیف</option>
                            <option value="1">⭐ خیلی ضعیف</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="library-item-notes">یادداشت شخصی (اختیاری):</label>
                        <textarea id="library-item-notes" rows="3" placeholder="نظرات و یادداشت‌های شخصی..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="library-item-cover">عکس جلد (اختیاری):</label>
                        <input type="file" id="library-item-cover" accept="image/*">
                        <img id="library-item-cover-preview" src="#" alt="Cover Preview" style="display: none; max-width: 100px; margin-top: 10px;">
                    </div>
                    <button type="submit" class="submit-button">افزودن به کتابخانه</button>
                    <button type="button" class="cancel-button" id="cancel-library-item-button">انصراف</button>
                </form>
            </section>

            <section id="login-screen" class="screen">
                <h2>ورود / ثبت نام</h2>
                <form id="auth-form">
                    <div class="form-group">
                        <label for="username">نام کاربری:</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">رمز عبور:</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit" class="submit-button">ورود</button>
                    <button type="button" class="cancel-button" id="register-button">ثبت نام</button>
                </form>
            </section>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALa0FRdcMhIh2_RehjpFW80ebVIfzdDss",
            authDomain: "ketabgard-48d6e.firebaseapp.com",
            projectId: "ketabgard-48d6e",
            storageBucket: "ketabgard-48d6e.appspot.com",
            messagingSenderId: "122721307630",
            appId: "1:122721307630:web:0b62bd4f43afa273785cff"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.firebase = { auth, db, storage };
    </script>

    <script type="module" src="script.js"></script>
</body>
</html>
